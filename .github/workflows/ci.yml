name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'ci-${{ github.ref }}'
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:check

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test:unit

      - name: Entrypoint tests
        run: sh docker/40-runtime-config.test.sh

      - name: Build
        run: pnpm build-only

      - name: Install playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build container image
        run: docker build -t example-openai-vuejs:ci .

      # Unit tests cannot reach this: the entrypoint, the nginx locations and
      # the vite sentinel only meet inside a running container. Everything
      # below has been wrong at some point in a way that still built cleanly.
      - name: Smoke-test the container
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8080:8080 \
            -e API_BASE_URL=https://api.example.com \
            -e PUBLIC_URL=https://chat.example.com \
            example-openai-vuejs:ci

          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done

          # The Dockerfile needs root for one step and switches back. Forget
          # the switch back and everything still works — just as root, which
          # is the whole reason for the unprivileged base image.
          echo '--- unprivileged ---'
          uid=$(docker exec smoke id -u)
          if [ "$uid" = '0' ]; then
            echo 'the container runs as root' >&2
            exit 1
          fi

          echo '--- /config.js ---'
          curl -fsS -D /tmp/config-headers http://127.0.0.1:8080/config.js | tee /tmp/config.js
          grep -q 'apiBaseUrl: "https://api.example.com"' /tmp/config.js
          grep -qi 'cache-control: no-store' /tmp/config-headers

          echo '--- / ---'
          curl -fsS http://127.0.0.1:8080/ >/tmp/index.html
          grep -q 'content="https://chat.example.com/"' /tmp/index.html

          # Not `! grep`: `set -e` does not fire on a negated command, so that
          # spelling would report success no matter what the page contained.
          if grep -q '%PUBLIC_URL%' /tmp/index.html; then
            echo 'the entry document still carries an unsubstituted placeholder' >&2
            exit 1
          fi

          echo '--- SPA fallback ---'
          curl -fsS http://127.0.0.1:8080/c/does-not-exist >/tmp/deep.html
          diff -q /tmp/index.html /tmp/deep.html

      - name: Container logs
        if: always()
        run: docker logs smoke || true

      # A container that starts without being told where its backend is would
      # quietly serve a broken app, so the entrypoint refuses. Prove it does.
      - name: Refuse to start without configuration
        run: |
          if docker run --rm example-openai-vuejs:ci; then
            echo 'the container started without API_BASE_URL or PUBLIC_URL' >&2
            exit 1
          fi

  # Publishing is gated on the whole of `ci`: an image that failed its tests
  # must never reach the registry, where something could deploy it.
  publish:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Issued for this run only, scoped by the `packages: write`
          # permission above. No personal access token is involved.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` is what compose.yaml pulls; the sha tag is what makes a
          # rollback possible, since `latest` moves.
          tags: |
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=example-openai-vuejs
            org.opencontainers.image.description=Open WebUI-style chat client for the example OpenAI proxy

      # linux/amd64 only. arm64 would need either QEMU, which makes the vite
      # build several times slower, or a second native runner and a manifest
      # merge. Add it when something actually deploys on arm — the failure is
      # loud (`no matching manifest`), not silent.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitHub Pages, for the public demo. Two jobs because only the second needs
  # the deployment environment and an id-token, and it is cheap to keep that
  # privilege off the job that runs the build.
  #
  # Pages serves static files, so nothing here can be configured at startup the
  # way the container is: the urls are compiled in. src/config.ts already falls
  # back to the build-time value when no /config.js sets one, which is exactly
  # this path.
  pages-build:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Pages was switched off on this repository; this turns it back on
          # with Actions as the source rather than requiring a click.
          enablement: true

      # A project site lives under /<repo>/, a custom domain at the root. Both
      # come from the step above rather than being hardcoded, because that is
      # the value that changes the day a domain is attached.
      - name: Resolve this deployment's own urls
        id: urls
        run: |
          set -euo pipefail
          base_path='${{ steps.pages.outputs.base_path }}'
          base_url='${{ steps.pages.outputs.base_url }}'

          # vite wants a trailing slash on `base`; configure-pages does not
          # promise one, and an empty value means the domain root.
          case "$base_path" in
            */) ;;
            *) base_path="$base_path/" ;;
          esac

          echo "base_path=$base_path" >>"$GITHUB_OUTPUT"
          echo "base_url=${base_url%/}" >>"$GITHUB_OUTPUT"
          echo "base=$base_path  url=${base_url%/}"

      - name: Build
        env:
          VITE_BASE: ${{ steps.urls.outputs.base_path }}
          VITE_PUBLIC_URL: ${{ steps.urls.outputs.base_url }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo 'VITE_API_BASE_URL is not set.' >&2
            echo 'Pages serves static files, so the backend url has to be compiled' >&2
            echo 'in. Set it as a repository *variable* under Settings -> Secrets' >&2
            echo 'and variables -> Actions -> Variables. It is not a secret: it' >&2
            echo 'ends up in the bundle either way.' >&2
            echo 'Without it the deployed app would call http://localhost:3000.' >&2
            exit 1
          fi
          pnpm build-only

      # Pages has no rewrite rules, so a reloaded /c/<id> is a plain 404. It
      # serves 404.html for those, and 404.html being the app itself lets the
      # router resolve the path. The copy already carries base-prefixed asset
      # urls, which is why it is made after the build rather than in public/.
      #
      # The response keeps its 404 status. Browsers render it regardless; it is
      # only crawlers that see the difference, and this replaces a redirect
      # hack that was worse on both counts.
      - name: Add the SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Not the workflow-wide group: cancelling a deployment mid-flight is worse
    # than letting it finish and superseding it.
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
