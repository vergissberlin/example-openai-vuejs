# Coolify deployment for the chat client.
#
# Point Coolify at this repository with the "Docker Compose" build pack and
# give the service a domain. Traefik terminates TLS and forwards to port 8080.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time, not runtime. Vite inlines VITE_* variables into the
        # bundle, so this has to be an argument to the build — set it in
        # Coolify's *Build Variables*, not its Environment Variables. Getting
        # this wrong fails quietly: the app builds and serves, and every
        # request goes to the wrong host.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set this to the backend url, e.g. https://api.example.com}

        # This deployment's own address, for the Open Graph tags. Required for
        # the same reason: unset it would silently fall back to the localhost
        # default and every shared link would preview as localhost.
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:?set this to this app's own url, e.g. https://chat.example.com}

    # Coolify reads this to route the domain you assign.
    expose:
      - '8080'

    restart: unless-stopped

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
