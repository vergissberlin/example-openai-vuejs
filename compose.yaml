# Coolify deployment for the chat client.
#
# Point Coolify at this repository with the "Docker Compose" build pack and
# give the service a domain. Traefik terminates TLS and forwards to port 8080.
#
# The image is not built here — GitHub Actions publishes it to GHCR on every
# push to main, and this pulls it. Set Coolify to redeploy on the registry
# webhook, or trigger it from the workflow.

services:
  web:
    image: ghcr.io/vergissberlin/example-openai-vuejs:latest

    # Plain environment variables, read when the container starts. This is
    # what the entrypoint turns into /config.js and the Open Graph tags — one
    # published image, configured per deployment.
    environment:
      API_BASE_URL: ${API_BASE_URL:?set this to the backend url, e.g. https://api.example.com}
      PUBLIC_URL: ${PUBLIC_URL:?set this to this app's own url, e.g. https://chat.example.com}

    # Coolify reads this to route the domain you assign.
    expose:
      - '8080'

    restart: unless-stopped

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
