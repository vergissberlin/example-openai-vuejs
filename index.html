<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue3 + OpenAI example</title>
    <meta property="og:title" content="custom chatgp with vue" />
    <meta property="og:type" content="demo" />
    <meta property="og:description" content="Custom ChatGPT with vue to illustrate how it could work" />
    <!-- The urls below are substituted at build time from VITE_PUBLIC_URL by
         the public-url plugin in vite.config.ts. Open Graph needs absolute
         urls, and a hardcoded one is wrong everywhere but where it was
         written — which is how these ended up pointing at a GitHub Pages site
         that no longer exists. -->
    <meta property="og:url" content="%PUBLIC_URL%/" />
    <meta property="og:image" content="%PUBLIC_URL%/og.png" />

    <!-- Runtime configuration, generated by the container when it starts.
         A classic script runs before the deferred module below, so the app
         sees it. Must stay uncached — see the /config.js block in nginx.conf. -->
    <script src="/config.js"></script>
</head>

<body class="w-screen h-screen overflow-hidden text-gray-800 bg-neutral-200 dark:bg-neutral-800 dark:text-gray-200">
    <div id="app" class="w-full h-full"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
