# Serves the built SPA.
#
# Port 8080 rather than 80: the image runs as an unprivileged user, which
# cannot bind ports below 1024.
server {
	listen 8080;
	server_name _;

	# Fingerprinted assets only. The entry document is not in here — the
	# Dockerfile keeps its template in /opt/app-template, so nothing can
	# accidentally serve the copy that still carries the %PUBLIC_URL%
	# placeholder. A misconfiguration then shows up as an error rather than
	# as a page with a broken url in its head.
	root /usr/share/nginx/html;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	# Container health, answered without touching the app.
	location = /healthz {
		access_log off;
		add_header Content-Type application/json;
		return 200 '{"status":"ok"}';
	}

	# Vite fingerprints these filenames, so a changed file always has a changed
	# url and can be cached indefinitely.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# Both files below are rendered by docker/40-runtime-config.sh when the
	# container starts, into a directory the runtime user may write to. The
	# document root itself stays read-only. The copies that vite produced are
	# still in the root but are shadowed by these exact-match locations.

	# The entry document must never be cached: it carries the references to
	# those fingerprinted files, and a stale copy points at assets that no
	# longer exist after a deploy.
	#
	# `/` gets its own exact location rather than relying on the `index`
	# directive, which resolves against the document root and would never
	# find the rendered document.
	location = / {
		root /opt/app-runtime;
		try_files /index.html =404;
		add_header Cache-Control "no-cache, must-revalidate" always;
	}

	location = /index.html {
		root /opt/app-runtime;
		add_header Cache-Control "no-cache, must-revalidate" always;
	}

	# The deployment's own configuration. `no-store` rather than
	# `no-cache`: this file has no fingerprint and its contents change
	# between deployments of the very same image, so a browser holding on to
	# an old copy would keep talking to the previous backend.
	location = /config.js {
		root /opt/app-runtime;
		add_header Cache-Control "no-store" always;
	}

	# SPA fallback. Client-side routes such as /c/<id> are not files on disk,
	# so anything unmatched hands back the entry document and lets the router
	# resolve it. This replaces the 404.html redirect that GitHub Pages needed.
	#
	# `$uri/` is left out deliberately: for a request of `/` it would match the
	# document root as a directory and stop there, instead of falling through
	# to the rendered /index.html above.
	location / {
		try_files $uri /index.html;
	}
}
